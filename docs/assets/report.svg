<text x="72.4" y="208.0" fill="#565f89" textLength="630.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Permissive verifier: it accepts completions that do not deserve reward. The</text>
<text x="72.4" y="227.0" fill="#565f89" textLength="638.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">false-positive rate and the accepted exploits are the numbers that matter; a</text>
<text x="72.4" y="246.0" fill="#565f89" textLength="184.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">policy will find them.</text>
<text x="38.8" y="284.0" fill="#565f89" textLength="672.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── EXPLOITS THAT WORK ──────────────────────────────────────────────────────────</text>
<text x="38.8" y="303.0" fill="#565f89" textLength="672.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">── EXPLOITS THAT WORK ──────────────────────────────────────────────────────────</text>
<text x="38.8" y="341.0" fill="#ff7a93" font-weight="600" textLength="109.2" lengthAdjust="spacingAndGlyphs" xml:space="preserve">contradiction</text>
<text x="72.4" y="360.0" fill="#565f89" textLength="621.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">Put the right answer in the reasoning and a wrong one in the conclusion. 2</text>
<text x="72.4" y="379.0" fill="#565f89" textLength="588.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">case(s) accepted. A policy that finds this gets paid for it, and every</text>
<text x="72.4" y="398.0" fill="#565f89" textLength="344.4" lengthAdjust="spacingAndGlyphs" xml:space="preserve">metric you watch will look like progress.</text>
<text x="72.4" y="417.0" fill="#c0caf5" font-weight="600" textLength="226.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">x.contradiction.wrong_final</text>
<text x="89.2" y="436.0" fill="#565f89" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">the correct value appears only in the reasoning; the stated answer is</text>
<text x="89.2" y="455.0" fill="#565f89" textLength="579.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">wrong. A verifier that greps the whole completion accepts this, which</text>
<text x="89.2" y="474.0" fill="#565f89" textLength="478.8" lengthAdjust="spacingAndGlyphs" xml:space="preserve">teaches the policy that its final answer does not matter.</text>
<text x="22.0" y="493.0" fill="#c0caf5" textLength="168.0" lengthAdjust="spacingAndGlyphs" xml:space="preserve">        reference:  </text>
<text x="190.0" y="493.0" fill="#7dcfff" textLength="33.6" lengthAdjust="spacingAndGlyphs" xml:space="preserve">&#x27;42&#x27;</text>
